<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bridge Hero</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: #1a1a2e; 
            touch-action: none; user-select: none;
            font-family: sans-serif;
        }
        canvas { display: block; background: #1a1a2e; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- DATA ---
let data = {
    gold: 0, highScore: 0, unlocked: ['Hero'], selected: 'Hero',
    unlockedPlats: ['Classic'], selectedPlat: 'Classic', worldReached: 1
};

// Try to load save data
const saved = localStorage.getItem('bridgeHeroV9');
if (saved) {
    try { data = JSON.parse(saved); } catch(e) { console.log("New Save Created"); }
}

function save() { localStorage.setItem('bridgeHeroV9', JSON.stringify(data)); }

// --- CHARACTERS ---
const CHARS = {
    'Hero': (x, y, s) => {
        ctx.fillStyle = '#e67e22'; ctx.fillRect(x, y, s, s);
        ctx.fillStyle = 'white'; ctx.fillRect(x+s*0.6, y+s*0.2, s*0.2, s*0.2);
    },
    'Ninja': (x, y, s) => {
        ctx.fillStyle = '#222'; ctx.fillRect(x, y, s, s);
        ctx.fillStyle = '#e74c3c'; ctx.fillRect(x, y+s*0.3, s, s*0.2);
    },
    'Robot': (x, y, s) => {
        ctx.fillStyle = '#bdc3c7'; ctx.fillRect(x, y, s, s);
        ctx.fillStyle = '#00d2ff'; ctx.fillRect(x+s*0.1, y+s*0.2, s*0.8, s*0.3);
    }
};

const PLATS = {
    'Classic': '#222', 'Obsidian': '#0b0d0f', 'Neon Blue': '#00d2ff', 
    'Neon Pink': '#ff00ff', 'Emerald': '#2ecc71', 'Gold Bar': '#f1c40f'
};

// --- GAME VARS ---
let state = 'MENU', score = 0, subState = 'waiting';
let platforms = [], pillars = [], stick = { len: 0, angle: -Math.PI/2 };
let player = { x: 0, y: 0, v: 0, targetX: 0, size: 24 };

function initGame(mode = 1) {
    score = (mode === 3) ? 50 : 0;
    platforms = [{ x: 50, w: 80 }];
    addPlat();
    player.x = 50 + 80 - 24;
    player.y = (mode === 3) ? canvas.height/2 : canvas.height * 0.65 - 24;
    state = 'PLAY'; subState = 'waiting';
    stick.len = 0; stick.angle = -Math.PI/2;
}

function addPlat() {
    const last = platforms[platforms.length-1];
    platforms.push({ x: last.x + last.w + 60 + Math.random()*100, w: 40 + Math.random()*40 });
}

function update() {
    if (state !== 'PLAY') return;
    if (score < 50) {
        if (subState === 'growing') stick.len += 4;
        if (subState === 'falling') {
            stick.angle += 0.2;
            if (stick.angle >= 0) { 
                stick.angle = 0; subState = 'walking'; 
                player.targetX = platforms[0].x + platforms[0].w + stick.len - 12; 
            }
        }
        if (subState === 'walking') {
            player.x += 5;
            if (player.x >= player.targetX) {
                let end = platforms[0].x + platforms[0].w + stick.len;
                if (end >= platforms[1].x && end <= platforms[1].x + platforms[1].w) {
                    score++; data.gold++; if(score > data.highScore) data.highScore = score;
                    save(); subState = 'transition';
                } else { subState = 'dead'; }
            }
        }
        if (subState === 'transition') {
            platforms.forEach(p => p.x -= 20); player.x -= 20;
            if (platforms[1].x <= 50) { platforms.shift(); addPlat(); subState = 'waiting'; stick.len = 0; stick.angle = -Math.PI/2; }
        }
        if (subState === 'dead') { player.y += 10; if (player.y > canvas.height) state = 'MENU'; }
    } else {
        player.v += 0.5; player.y += player.v;
        if (player.y > canvas.height || player.y < 0) state = 'MENU';
    }
}

function draw() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (state === 'MENU') {
        ctx.fillStyle = 'white'; ctx.textAlign = 'center';
        ctx.font = 'bold 40px Arial'; ctx.fillText("BRIDGE HERO", canvas.width/2, 150);
        ctx.font = '20px Arial'; ctx.fillText("Tap to Start", canvas.width/2, 300);
        ctx.fillText("Best: " + data.highScore, canvas.width/2, 200);
    } else {
        let ph = canvas.height * 0.35;
        platforms.forEach(p => {
            ctx.fillStyle = PLATS[data.selectedPlat] || '#222';
            ctx.fillRect(p.x, canvas.height - ph, p.w, ph);
        });
        ctx.strokeStyle = 'white'; ctx.lineWidth = 4;
        let sx = platforms[0].x + platforms[0].w, sy = canvas.height - ph;
        ctx.beginPath(); ctx.moveTo(sx, sy);
        ctx.lineTo(sx + Math.cos(stick.angle)*stick.len, sy + Math.sin(stick.angle)*stick.len); ctx.stroke();
        
        CHARS[data.selected](player.x, player.y, player.size);
        ctx.fillStyle = 'white'; ctx.font = '40px Arial'; ctx.fillText(score, canvas.width/2, 100);
    }
    requestAnimationFrame(draw);
}

// Input
function input() {
    if (state === 'MENU') initGame();
    else if (subState === 'waiting') subState = 'growing';
    else if (score >= 50) player.v = -8;
}

function release() {
    if (subState === 'growing') subState = 'falling';
}

window.addEventListener('mousedown', input);
window.addEventListener('mouseup', release);
window.addEventListener('touchstart', (e) => { e.preventDefault(); input(); }, {passive: false});
window.addEventListener('touchend', release);

draw();
update();
setInterval(update, 1000/60);
</script>
</body>
</html>
