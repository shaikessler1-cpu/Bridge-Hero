<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bridge Hero</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: #1a1a2e; 
            touch-action: none; user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas { display: block; touch-action: none; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- DATA & SAVING ---
let data;
try {
    data = JSON.parse(localStorage.getItem('bridgeHeroFinalV8')) || {
        gold: 0, highScore: 0, unlocked: ['Hero'], selected: 'Hero',
        unlockedPlats: ['Classic'], selectedPlat: 'Classic', worldReached: 1
    };
} catch(e) {
    data = { gold: 0, highScore: 0, unlocked: ['Hero'], selected: 'Hero', unlockedPlats: ['Classic'], selectedPlat: 'Classic', worldReached: 1 };
}
function save() { localStorage.setItem('bridgeHeroFinalV8', JSON.stringify(data)); }

// --- DRAWING ASSETS ---
const CHARS = {
    'Hero': { price: 0, draw: (x, y, s) => {
        ctx.fillStyle = '#e67e22'; ctx.beginPath(); ctx.roundRect(x, y, s, s, s*0.2); ctx.fill();
        ctx.fillStyle = 'white'; ctx.fillRect(x+s*0.6, y+s*0.2, s*0.2, s*0.2);
    }},
    'Ninja': { price: 30, draw: (x, y, s) => {
        ctx.fillStyle = '#222'; ctx.beginPath(); ctx.roundRect(x, y, s, s, s*0.2); ctx.fill();
        ctx.fillStyle = '#e74c3c'; ctx.fillRect(x, y+s*0.3, s, s*0.2);
    }},
    'Robot': { price: 50, draw: (x, y, s) => {
        ctx.fillStyle = '#bdc3c7'; ctx.beginPath(); ctx.roundRect(x, y, s, s, 2); ctx.fill();
        ctx.fillStyle = '#00d2ff'; ctx.fillRect(x+s*0.1, y+s*0.2, s*0.8, s*0.3);
    }},
    'Alien': { price: 75, draw: (x, y, s) => {
        ctx.fillStyle = '#a29bfe'; ctx.beginPath(); ctx.ellipse(x+s/2, y+s/2, s/1.8, s/2.2, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(x+s*0.35, y+s*0.45, s*0.1, 0, 7); ctx.arc(x+s*0.65, y+s*0.45, s*0.1, 0, 7); ctx.fill();
    }},
    'Knight': { price: 150, draw: (x, y, s) => {
        ctx.fillStyle = '#7f8c8d'; ctx.fillRect(x, y, s, s);
        ctx.fillStyle = '#f1c40f'; ctx.fillRect(x, y+s*0.4, s, s*0.1);
    }},
    'Demon': { price: 250, draw: (x, y, s) => {
        ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.roundRect(x, y, s, s, 4); ctx.fill();
        ctx.fillStyle = 'black'; ctx.fillRect(x+s*0.2, y+s*0.2, s*0.2, s*0.2); ctx.fillRect(x+s*0.6, y+s*0.2, s*0.2, s*0.2);
    }}
};

const PLATS = {
    'Classic': { color: '#222', price: 0 },
    'Obsidian': { color: '#0b0d0f', price: 40 },
    'Neon Blue': { color: '#00d2ff', price: 60 },
    'Neon Pink': { color: '#ff00ff', price: 60 },
    'Emerald': { color: '#2ecc71', price: 100 },
    'Gold Bar': { color: '#f1c40f', price: 150 }
};

// --- STATE VARIABLES ---
let state = 'MENU', score = 0, subState = 'waiting', shopTab = 'CHARS';
let platforms = [], pillars = [], stick = { len: 0, angle: -Math.PI/2 };
let player = { x: 0, y: 0, v: 0, targetX: 0, size: 24 };
const BTNS = { play1: {}, play3: {}, shop: {}, back: {} };

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

function initGame(mode = 1) {
    score = (mode === 3) ? 50 : 0;
    platforms = [{ x: 50, w: 80 }];
    pillars = [];
    addPlat();
    player.x = 50 + 80 - 24;
    player.y = (mode === 3) ? canvas.height/2 : canvas.height * 0.65 - 24;
    player.v = 0; stick = { len: 0, angle: -Math.PI/2 };
    state = 'PLAY'; subState = 'waiting';
}

function addPlat() {
    const last = platforms[platforms.length-1];
    let minG = score >= 25 ? 80 : 50;
    let maxG = score >= 25 ? 200 : 150;
    let minW = score >= 25 ? 30 : 40;
    let maxW = score >= 25 ? 50 : 80;
    platforms.push({ x: last.x + last.w + minG + Math.random()(maxG - minG), w: minW + Math.random()(maxW - minW) });
}

function update() {
    if (state !== 'PLAY') return;
    if (score < 50) {
        if (subState === 'growing') stick.len += 3.5;
        if (subState === 'falling') {
            stick.angle += 0.15;
            if (stick.angle >= 0) { 
                stick.angle = 0; 
                subState = 'walking'; 
                player.targetX = platforms[0].x + platforms[0].w + stick.len - 12; 
            }
        }
        if (subState === 'walking') {
            player.x += 4.5;
            if (player.x >= player.targetX) {
                let end = platforms[0].x + platforms[0].w + stick.len;
                if (end >= platforms[1].x && end <= platforms[1].x + platforms[1].w) {
                    score++; if (score % 5 === 0) data.gold += 1;
                    if (score > data.highScore) data.highScore = score;
                    if (score === 50) data.worldReached = 3;
                    save(); subState = 'transition';
                } else { subState = 'dead'; }
            }
        }
        if (subState === 'transition') {
            platforms.forEach(p => p.x -= 15); player.x -= 15;
            if (platforms[1].x <= 50) { 
                platforms.shift(); addPlat(); 
                stick.len = 0; stick.angle = -Math.PI/2;
                subState = 'waiting'; 
            }
        }
        if (subState === 'dead') { player.y += 10; if (player.y > canvas.height) state = 'MENU'; }
    } else {
        // Level 3 Flight
        player.v += 0.4; player.y += player.v;
        if (pillars.length === 0 || canvas.width - pillars[pillars.length-1].x > 250) {
            let gap = 170; let pos = 100 + Math.random()*(canvas.height-270);
            pillars.push({ x: canvas.width, top: pos, gap: gap, passed: false });
        }
        pillars.forEach(p => {
            p.x -= 4;
            if (!p.passed && p.x + 50 < player.x) { p.passed = true; score++; data.gold++; save(); }
            if (player.x + 20 > p.x && player.x < p.x + 50) {
                if (player.y < p.top || player.y + 20 > p.top + p.gap) state = 'MENU';
            }
        });
        if (player.y > canvas.height || player.y < 0) state = 'MENU';
        pillars = pillars.filter(p => p.x > -100);
    }
}

function draw() {
    resize();
    let bg = (state === 'PLAY' && score >= 50) ? "#0f0c29" : "#1a1a2e";
    ctx.fillStyle = bg; ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (state === 'MENU') {
        ctx.fillStyle = 'white'; ctx.textAlign = 'center';
        ctx.font = 'bold 40px Arial'; ctx.fillText("BRIDGE HERO", canvas.width/2, canvas.height*0.2);
        ctx.font = '18px Arial'; ctx.fillStyle = '#f1c40f';
        ctx.fillText(BEST SCORE: ${data.highScore}, canvas.width/2, canvas.height*0.28);
        
        drawBtn(BTNS.play1, "START WORLD 1", canvas.height*0.45, "#ff4b2b");
        if(data.worldReached >= 3) drawBtn(BTNS.play3, "WORLD 3: FLIGHT", canvas.height*0.55, "#00b09b");
        drawBtn(BTNS.shop, "THE SHOP", canvas.height*0.65, "#4776e6");
        
        ctx.fillStyle = 'white'; ctx.fillText(GOLD: ${data.gold}, canvas.width/2, canvas.height*0.8);
    } 
    else if (state === 'SHOP') {
        ctx.fillStyle = 'white'; ctx.textAlign = 'center'; ctx.font = 'bold 25px Arial';
        ctx.fillText("SHOP", canvas.width/2, 50);
        
        drawBtn(BTNS.back, "BACK", canvas.height*0.9, "#778899");
        
        let i = 0;
        let items = shopTab === 'CHARS' ? CHARS : PLATS;
        for(let name in items) {
            let x = canvas.width/2 - 80 + (i % 2) * 160;
            let y = 150 + Math.floor(i/2) * 110;
            let isOwned = (shopTab === 'CHARS' ? data.unlocked : data.unlockedPlats).includes(name);
            let isEquipped = (shopTab === 'CHARS' ? data.selected : data.selectedPlat) === name;

            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.beginPath(); ctx.roundRect(x-70, y-45, 140, 90, 10); ctx.fill();
            if(isEquipped) { ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 3; ctx.stroke(); }
            
            if(shopTab === 'CHARS') CHARS[name].draw(x-15, y-25, 30);
            else { ctx.fillStyle = PLATS[name].color; ctx.fillRect(x-25, y-20, 50, 15); }

            ctx.fillStyle = isOwned ? 'white' : '#f1c40f';
            ctx.font = '12px Arial';
            ctx.fillText(isOwned ? (isEquipped ? "EQUIPPED" : name) : items[name].price + " G", x, y+35);
            i++;
        }
    }
    else {
        // Play Draw
        let ph = canvas.height * 0.35;
        if (score < 50) {
            platforms.forEach((p, idx) => {
                ctx.fillStyle = PLATS[data.selectedPlat].color;
                ctx.fillRect(p.x, canvas.height-ph, p.w, ph);
                if (idx === 1) {
                    ctx.fillStyle = 'red'; ctx.beginPath();
                    ctx.arc(p.x + p.w/2, canvas.height-ph + 5, 4, 0, Math.PI*2); ctx.fill();
                }
            });
            ctx.strokeStyle = 'white'; ctx.lineWidth = 4;
            let sx = platforms[0].x + platforms[0].w, sy = canvas.height - ph;
            ctx.beginPath(); ctx.moveTo(sx, sy);
            ctx.lineTo(sx + Math.cos(stick.angle)*stick.len, sy + Math.sin(stick.angle)*stick.len); ctx.stroke();
        } else {
            pillars.forEach(p => { ctx.fillStyle = "#2ecc71"; ctx.fillRect(p.x, 0, 50, p.top); ctx.fillRect(p.x, p.top+p.gap, 50, canvas.height); });
        }
        CHARS[data.selected].draw(player.x, player.y, player.size);
        ctx.fillStyle = 'white'; ctx.font = 'bold 50px Arial'; ctx.fillText(score, canvas.width/2, 80);
    }
}

function drawBtn(btn, txt, y, col) {
    btn.w = 200; btn.h = 50; btn.x = canvas.width/2; btn.y = y;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.roundRect(btn.x-100, btn.y-25, 200, 50, 10); ctx.fill();
    ctx.fillStyle = 'white'; ctx.font = 'bold 16px Arial'; ctx.fillText(txt, btn.x, btn.y+5);
}

function isInside(x, y, btn) {
    return x > btn.x-100 && x < btn.x+100 && y > btn.y-25 && y < btn.y+25;
}

function handleInput(x, y) {
    if (state === 'MENU') {
        if (isInside(x, y, BTNS.play1)) initGame(1);
        if (data.worldReached >= 3 && isInside(x, y, BTNS.play3)) initGame(3);
        if (isInside(x, y, BTNS.shop)) state = 'SHOP';
    } 
    else if (state === 'SHOP') {
        if (isInside(x, y, BTNS.back)) state = 'MENU';
        let i = 0; let items = shopTab === 'CHARS' ? CHARS : PLATS;
        for(let name in items) {
            let ix = canvas.width/2 - 80 + (i % 2) * 160;
            let iy = 150 + Math.floor(i/2) * 110;
            if (Math.abs(x - ix) < 70 && Math.abs(y - iy) < 45) {
                let list = shopTab === 'CHARS' ? data.unlocked : data.unlockedPlats;
                if (!list.includes(name)) {
                    if (data.gold >= items[name].price) { data.gold -= items[name].price; list.push(name); save(); }
                } else {
                    if (shopTab === 'CHARS') data.selected = name; else data.selectedPlat = name; save();
                }
            } i++;
        }
    }
    else {
        if (score < 50) { if (subState === 'waiting') subState = 'growing'; }
        else { player.v = -7; }
    }
}

// --- EVENT LISTENERS ---
window.onload = () => {
    resize();
    
    const trigger = (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        handleInput(x, y);
    };

    canvas.addEventListener('mousedown', trigger);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); trigger(e); }, {passive: false});
    
    canvas.addEventListener('mouseup', () => { if (subState === 'growing') subState = 'falling'; });
    canvas.addEventListener('touchend', () => { if (subState === 'growing') subState = 'falling'; });

    function frame() { update(); draw(); requestAnimationFrame(frame); }
    frame();
};
</script>
</body>
</html>
